name: tmp-screens
on:
  push:
    branches: [tmp/screens]
permissions:
  contents: read
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm turbo run build --filter=web
      - working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e screenshots --project=desktop
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
      - name: Dump downscaled screenshots
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import base64, glob, io, os
          from PIL import Image
          for f in sorted(glob.glob("screenshots/home-*.png")):
              im = Image.open(f).convert("RGB")
              im = im.resize((im.width // 2, im.height // 2))
              buf = io.BytesIO(); im.save(buf, "JPEG", quality=72)
              name = os.path.basename(f)[:-4] + ".jpg"
              print("=====BEGIN " + name)
              print(base64.b64encode(buf.getvalue()).decode())
              print("=====END", flush=True)
          PY
